services:
  web:
    build: .
    container_name: fsa-website
    ports:
      - "127.0.0.1:8087:80"   # loopback only: Docker publishes bypass ufw; the tunnel uses the docker network
    restart: unless-stopped
    volumes:
      # Large CC-BY-NC-SA library PDFs served from host, not baked into the image.
      - ./assets/library:/usr/share/nginx/html/assets/library:ro
    networks:
      - cloudflare

networks:
  cloudflare:
    external: true
